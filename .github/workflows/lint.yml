name: Lint

on:
	push:
		branches:
			- master
	pull_request:

permissions:
	contents: read

jobs:
	lint:
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up Python
				uses: actions/setup-python@v5
				with:
					python-version: "3.12"

			- name: Install pylint
				run: |
					python -m pip install --upgrade pip
					pip install pylint

			- name: Run pylint
				run: pylint src
