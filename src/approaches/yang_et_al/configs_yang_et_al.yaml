paths:
  gray_frames: data/lepton/processed_lepton_data/05032026_before_after_sport_interpolated
  video: data/recorded_videos/thermal_video_from_y16_frames/05032026_before_after_sport.mp4
  video_tracked_face: data/recorded_videos/nair_et_al/output_tracked_video.mp4
  video_thresholded_pixel: data/recorded_videos/nair_et_al/output_thresholded_video.mp4
  video_facemesh: data/recorded_videos/nair_et_al/output_facemesh_video.mp4
  pixels_log: data/saved_data/nair_et_al/roi_pixel_log.npy
  video_thermal_with_roi_masks: data/recorded_videos/nair_et_al/output_video_with_roi_masks.mp4
  roi_pixel_data: data/saved_data/nair_et_al/roi_pixel_data.npy
  ground_truth: data/ground_truth/opensignals/extracted_npy_files/05032026/opensignals_0007800F80FA_2026-03-05_17-17-42.npz
processing:
  overwrite_existing_files: true
  plot_steps: false
  fps: 8.767701401175636 
  bandpass_lowcut: 0.4
  bandpass_highcut: 4.0 # 5.0 in paper not achievable with fps (Nyquist frequency is 4.383850700587818 Hz)
  bandpass_order: 5
  use_ema: true
  ema_alpha: 0.15
  manual_roi_enabled: false
  manual_roi_name: manual_roi
  manual_roi_mode: polygon
  manual_roi_mask_load_path: null
  manual_roi_mask_save_path: data/saved_data/new_approach/manual_roi_mask.npy
  manual_roi_names:
  - roi_signal_temple
  manual_roi_modes:
  - polygon
  manual_roi_mask_load_paths:
  - null
  manual_roi_mask_save_paths:
  - data/saved_data/new_approach/manual_roi_signal_temple.npy
  manual_roi_selection_colormap: false
  # Which named ROIs to use from roi_landmarks_options (list of names). Example:
  used_rois: [forehead, left_cheek]
  # A short name identifying the ROI selection (used for saved filenames)
  roi_name: tracker_landmark_threshold_30_c
timing:
  time_first_frame_signal: 10.5
  time_first_frame_ecg: 0.0
  timespan_signal_to_look_at: [0.0, 10.0]
  notes:
    time_first_frame_signal_expected: null
    time_first_frame_ecg_expected: null

# NOTE: ROI landmark definitions (roi_landmarks_options) have been moved to the
# shared file `src/approaches/new_approach/roi_landmarks_options.yaml`.
# They are loaded and selected (based on `processing.used_rois`) in
# `get_roi_data` (get_roi_data_pipeline). To add or change an ROI definition,
# edit that shared file. An inline `roi_landmarks_options:` mapping may still be
# added here to override individual definitions if needed.
